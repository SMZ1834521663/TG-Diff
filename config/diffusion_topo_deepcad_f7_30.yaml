data:
    data_name: deepcad_f7_30
    path_train: "/data/songhx24/dataset_smz/deepcad/f730_filted_2_train.h5"
    path_val: "/data/songhx24/dataset_smz/deepcad/f730_filted_2_val.h5"
    path_test: "/data/songhx24/dataset_smz/deepcad/f730_filted_2_test.h5"
    path_train_pkl: "./topo/pkl/f730_train_topo_canonical.pkl"
    max_faces: 30
    max_edges: 200
    raw_uv_grid: 16
    vae_latent_dim: 128

model:
    epochs: 6000
    batch_size: 3072
    val_per_epoch: 0  #not use
    save_per_epoch: 100
    log_per_epoch: 1
    parallel: True
    lr: 5e-4
    betas: [0.90, 0.95]
    weight_decay: 1e-6
    loss_weight: 1
    num_workers: 8
    output_dir: "./exp"
    output_tag: "diffusion_topo"
    use_ema: False
    pretrained_path: "./exp/diffusion_topo_deepcad_f7_30/checkpoints/deepcad_f7_30_topo_diff_best.pth"
    last_epoch: 0
    use_aug: False


